<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura RNG Simulator</title>
    <style>
        /* 기본 리셋 및 시스템 폰트 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #08080c;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* 배경 배경 이펙트용 Canvas */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* 메인 컨테이너 */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
            justify-content: space-between;
        }

        /* 상단 헤더 */
        header {
            text-align: center;
            margin-top: 10px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        header h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #a855f7, #ec4899, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .stats-bar {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            font-size: 0.95rem;
        }

        .stat-item span {
            color: #fbbf24;
            font-weight: bold;
        }

        /* 중앙 아우라 전시 구역 */
        .aura-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            width: 100%;
            position: relative;
        }

        /* 아우라 가상 오브젝트 및 원형 오라 효과 */
        .aura-visual {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 25px;
        }

        .aura-visual::before {
            content: '';
            position: absolute;
            inset: -15px;
            border-radius: 50%;
            background: inherit;
            filter: blur(20px);
            opacity: 0.6;
            z-index: -1;
            animation: pulse 2s infinite alternate;
        }

        .aura-core {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 30px #fff;
            position: relative;
            z-index: 2;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.5; }
            100% { transform: scale(1.1); opacity: 0.8; }
        }

        /* 메인 텍스트 정보 */
        .aura-info {
            text-align: center;
            z-index: 5;
        }

        .equipped-tag {
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #10b981;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .aura-name {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 6px;
            text-shadow: 0 0 20px rgba(0,0,0,0.9);
            transition: color 0.3s ease;
        }

        .aura-rarity {
            font-size: 1.3rem;
            font-weight: 700;
            color: #e5e7eb;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 18px;
            border-radius: 12px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* 메인 컨트롤 버튼 영역 */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4), inset 0 2px 0 rgba(255,255,255,0.3);
            transition: transform 0.1s ease, box-shadow 0.15s ease;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.6), inset 0 2px 0 rgba(255,255,255,0.3);
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 10px rgba(37, 99, 235, 0.4);
        }

        .btn-auto {
            background: linear-gradient(135deg, #4b5563, #374151);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            width: 50%;
        }

        .btn-auto.active {
            background: linear-gradient(135deg, #059669, #047857);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            animation: autoPulse 1.5s infinite alternate;
        }

        @keyframes autoPulse {
            0% { box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }
            100% { box-shadow: 0 0 25px rgba(16, 185, 129, 0.8); }
        }

        .btn-collection {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
            width: 50%;
        }

        /* 쿨타임 프로그레스바 */
        .cooldown-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .cooldown-bar {
            width: 0%;
            height: 100%;
            background: #3b82f6;
            transition: width 0.05s linear;
        }

        /* 도감 / 인벤토리 모달 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 90%;
            max-width: 700px;
            max-height: 80vh;
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 800;
        }

        .close-btn {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 1.8rem;
            cursor: pointer;
        }

        .close-btn:hover { color: white; }

        .collection-list {
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            padding-right: 5px;
        }

        .collection-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .collection-card.unlocked {
            background: rgba(255, 255, 255, 0.07);
        }

        .collection-card.locked {
            opacity: 0.3;
            filter: grayscale(1);
        }

        .card-name {
            font-size: 0.95rem;
            font-weight: 800;
            margin-top: 6px;
        }

        .card-rarity {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 2px;
        }

        .card-count {
            position: absolute;
            top: 6px;
            right: 8px;
            font-size: 0.7rem;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 6px;
            border-radius: 10px;
            color: #fbbf24;
        }

        /* 컷씬 / 잭팟 화면 연출 */
        #cutsceneOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        #cutsceneOverlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .cutscene-text {
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
            letter-spacing: 5px;
            animation: zoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .cutscene-sub {
            font-size: 1.5rem;
            margin-top: 15px;
            color: #fbbf24;
            opacity: 0;
            animation: fadeIn 0.5s ease 0.6s forwards;
        }

        @keyframes zoomIn {
            0% { transform: scale(0.2); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* 화면 흔들림 애니메이션 */
        .shake {
            animation: shakeAnim 0.4s ease-in-out;
        }

        @keyframes shakeAnim {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-8px, 5px); }
            40% { transform: translate(8px, -5px); }
            60% { transform: translate(-5px, 3px); }
            80% { transform: translate(5px, -3px); }
        }
    </style>
</head>
<body>

    <!-- 배경 파티클 캔버스 -->
    <canvas id="bgCanvas"></canvas>

    <div class="container">
        <!-- 헤더 영역 -->
        <header>
            <h1>AURA RNG</h1>
            <div class="stats-bar">
                <div class="stat-item">총 뽑기 횟수: <span id="statTotalRolls">0</span>회</div>
                <div class="stat-item">최고 희귀도: <span id="statBestRarity">1/2</span></div>
            </div>
        </header>

        <!-- 현재 장착 중인 아우라 표시 -->
        <div class="aura-display">
            <div class="aura-visual" id="auraVisual">
                <div class="aura-core" id="auraCore"></div>
            </div>
            <div class="aura-info">
                <div class="equipped-tag" id="equippedTag">EQUIPPED</div>
                <div class="aura-name" id="auraName">Common</div>
                <div class="aura-rarity" id="auraRarity">1 / 2</div>
            </div>
        </div>

        <!-- 하단 컨트롤 버튼 -->
        <div class="controls">
            <div class="cooldown-bar-container">
                <div class="cooldown-bar" id="cooldownBar"></div>
            </div>
            
            <button class="btn" id="btnRoll">ROLL (0.5s)</button>
            
            <div class="btn-group">
                <button class="btn btn-auto" id="btnAuto">AUTO: OFF</button>
                <button class="btn btn-collection" id="btnOpenCollection">도감 / 수집</button>
            </div>
        </div>
    </div>

    <!-- 도감 모달 -->
    <div class="modal" id="collectionModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Aura Collection</div>
                <button class="close-btn" id="btnCloseCollection">&times;</button>
            </div>
            <div class="collection-list" id="collectionList"></div>
        </div>
    </div>

    <!-- 희귀 아우라 컷씬 연출 레이어 -->
    <div id="cutsceneOverlay">
        <div class="cutscene-text" id="cutsceneText">STARLIGHT</div>
        <div class="cutscene-sub" id="cutsceneSub">1 / 1,000,000</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            /* ==========================================================================
               1. 아우라 데이터베이스 (Sol's RNG 감성 특이 숫자 및 대형 숫자 수록)
               ========================================================================== */
            const AURAS = [
                { id: 'common',    name: 'Common',       chance: 2,           color: '#a1a1aa', glow: '#d4d4d8', particleCount: 5 },
                { id: 'uncommon',  name: 'Uncommon',     chance: 4,           color: '#4ade80', glow: '#22c55e', particleCount: 8 },
                { id: 'good',      name: 'Good',         chance: 8,           color: '#60a5fa', glow: '#3b82f6', particleCount: 12 },
                { id: 'rare',      name: 'Natural',      chance: 16,          color: '#facc15', glow: '#eab308', particleCount: 15 },
                { id: 'lucky7',    name: 'Lucky Seven',  chance: 77,          color: '#38bdf8', glow: '#0284c7', particleCount: 20 },
                { id: 'rare_plus', name: 'Gilded',       chance: 250,         color: '#f59e0b', glow: '#d97706', particleCount: 25 },
                { id: 'comet',     name: 'Comet',        chance: 1200,        color: '#818cf8', glow: '#4f46e5', particleCount: 35 },
                { id: 'devil',     name: 'Diaboli',      chance: 6666,        color: '#ef4444', glow: '#dc2626', particleCount: 40 },
                { id: 'emerald',   name: 'Emerald',      chance: 12345,       color: '#10b981', glow: '#059669', particleCount: 45 },
                { id: 'shadow',    name: 'Shadow',       chance: 50000,       color: '#312e81', glow: '#1e1b4b', particleCount: 50 },
                { id: 'boundless', name: 'Boundless',    chance: 777777,      color: '#c084fc', glow: '#9333ea', particleCount: 65, cutscene: true },
                { id: 'galaxy',    name: 'Galaxy',       chance: 5000000,     color: '#ec4899', glow: '#db2777', particleCount: 80, cutscene: true },
                { id: 'matrix',    name: 'Matrix',       chance: 100000000,   color: '#22c55e', glow: '#15803d', particleCount: 100, cutscene: true },
                { id: 'abyssal',   name: 'Abyssal Hunter', chance: 400000000, color: '#0ea5e9', glow: '#0369a1', particleCount: 120, cutscene: true },
                { id: 'sovereign', name: 'Sovereign',    chance: 1000000000,  color: '#fbbf24', glow: '#ffffff', particleCount: 150, cutscene: true }
            ];

            // 확률 역순 정렬 (희귀한 아우라부터 당첨 여부 검사)
            AURAS.sort((a, b) => b.chance - a.chance);

            /* ==========================================================================
               2. 게임 상태 관리
               ========================================================================== */
            let state = {
                rolls: 0,
                equipped: AURAS[AURAS.length - 1], // 초기값: Common
                inventory: {},
                autoRoll: false,
                isRolling: false
            };

            // 초기 인벤토리 생성
            AURAS.forEach(a => state.inventory[a.id] = 0);
            state.inventory[state.equipped.id] = 1;

            /* ==========================================================================
               3. Web Audio API (사운드 효과음)
               ========================================================================== */
            let audioCtx = null;

            function initAudio() {
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) {
                        audioCtx = new AudioContextClass();
                    }
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            function playSound(type) {
                if (!audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    const now = audioCtx.currentTime;

                    if (type === 'roll') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(300, now);
                        osc.frequency.exponentialRampToValueAtTime(150, now + 0.1);
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                        osc.start(now);
                        osc.stop(now + 0.1);
                    } else if (type === 'upgrade') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(440, now);
                        osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);
                        gain.gain.setValueAtTime(0.3, now);
                        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                        osc.start(now);
                        osc.stop(now + 0.3);
                    } else if (type === 'jackpot') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(220, now);
                        osc.frequency.exponentialRampToValueAtTime(880, now + 0.8);
                        gain.gain.setValueAtTime(0.4, now);
                        gain.gain.linearRampToValueAtTime(0.01, now + 0.8);
                        osc.start(now);
                        osc.stop(now + 0.8);
                    }
                } catch(e) {
                    // 사운드 재생 오류 시 무시
                }
            }

            /* ==========================================================================
               4. 배경 및 아우라 연출 파티클 시스템 (Canvas)
               ========================================================================== */
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [];

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class Particle {
                constructor(color) {
                    this.reset(color);
                }

                reset(color) {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 3 + 1;
                    this.speedX = (Math.random() - 0.5) * 1.5;
                    this.speedY = (Math.random() - 0.5) * 1.5;
                    this.color = color || state.equipped.color;
                    this.alpha = Math.random() * 0.6 + 0.2;
                }

                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;

                    if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                        this.reset();
                    }
                }

                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            function initParticles() {
                particles = [];
                const count = state.equipped.particleCount || 20;
                for (let i = 0; i < count; i++) {
                    particles.push(new Particle(state.equipped.color));
                }
            }

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animateParticles);
            }

            initParticles();
            animateParticles();

            /* ==========================================================================
               5. 뽑기 RNG & UI 업데이트 로직
               ========================================================================== */
            function formatRarity(chance) {
                return `1 / ${chance.toLocaleString()}`;
            }

            function roll() {
                initAudio();
                if (state.isRolling) return;

                state.isRolling = true;
                state.rolls++;
                document.getElementById('statTotalRolls').innerText = state.rolls.toLocaleString();

                // 0.5초 쿨타임 애니메이션
                const cooldownBar = document.getElementById('cooldownBar');
                cooldownBar.style.transition = 'none';
                cooldownBar.style.width = '100%';
                setTimeout(() => {
                    cooldownBar.style.transition = 'width 0.45s linear';
                    cooldownBar.style.width = '0%';
                }, 10);

                // RNG 추첨
                let rolledAura = AURAS[AURAS.length - 1]; // 기본 Common
                for (let aura of AURAS) {
                    const rand = Math.random() * aura.chance;
                    if (rand < 1) {
                        rolledAura = aura;
                        break;
                    }
                }

                state.inventory[rolledAura.id]++;
                playSound('roll');

                if (rolledAura.cutscene && rolledAura.chance > state.equipped.chance) {
                    triggerCutscene(rolledAura);
                } else {
                    processRollResult(rolledAura);
                }
            }

            function processRollResult(rolledAura) {
                // 더 희귀한 아우라 획득 시 자동 장착
                if (rolledAura.chance > state.equipped.chance) {
                    state.equipped = rolledAura;
                    playSound('upgrade');
                    document.body.classList.add('shake');
                    setTimeout(() => document.body.classList.remove('shake'), 400);
                    updateDisplay();
                    initParticles();
                }

                updateBestRarityStat();

                setTimeout(() => {
                    state.isRolling = false;
                    if (state.autoRoll) {
                        roll();
                    }
                }, 450);
            }

            function triggerCutscene(aura) {
                playSound('jackpot');
                const overlay = document.getElementById('cutsceneOverlay');
                const text = document.getElementById('cutsceneText');
                const sub = document.getElementById('cutsceneSub');

                text.innerText = aura.name;
                text.style.color = aura.color;
                text.style.textShadow = `0 0 30px ${aura.glow}`;
                sub.innerText = formatRarity(aura.chance);

                overlay.classList.add('active');

                setTimeout(() => {
                    overlay.classList.remove('active');
                    processRollResult(aura);
                }, 2200);
            }

            function updateDisplay() {
                const aura = state.equipped;
                const nameEl = document.getElementById('auraName');
                const rarityEl = document.getElementById('auraRarity');
                const visualEl = document.getElementById('auraVisual');
                const coreEl = document.getElementById('auraCore');

                nameEl.innerText = aura.name;
                nameEl.style.color = aura.color;
                nameEl.style.textShadow = `0 0 20px ${aura.glow}`;

                rarityEl.innerText = formatRarity(aura.chance);
                
                visualEl.style.background = `radial-gradient(circle, ${aura.color} 0%, rgba(0,0,0,0) 70%)`;
                visualEl.style.boxShadow = `0 0 50px ${aura.glow}`;

                coreEl.style.background = aura.color;
                coreEl.style.boxShadow = `0 0 30px ${aura.glow}, 0 0 60px #fff`;
            }

            function updateBestRarityStat() {
                let maxChance = 1;
                AURAS.forEach(a => {
                    if (state.inventory[a.id] > 0 && a.chance > maxChance) {
                        maxChance = a.chance;
                    }
                });
                document.getElementById('statBestRarity').innerText = `1 / ${maxChance.toLocaleString()}`;
            }

            /* ==========================================================================
               6. 버튼 이벤트 리스너
               ========================================================================== */
            document.getElementById('btnRoll').addEventListener('click', () => {
                if (!state.isRolling) roll();
            });

            document.getElementById('btnAuto').addEventListener('click', () => {
                state.autoRoll = !state.autoRoll;
                const btn = document.getElementById('btnAuto');
                if (state.autoRoll) {
                    btn.classList.add('active');
                    btn.innerText = 'AUTO: ON';
                    if (!state.isRolling) roll();
                } else {
                    btn.classList.remove('active');
                    btn.innerText = 'AUTO: OFF';
                }
            });

            document.getElementById('btnOpenCollection').addEventListener('click', openCollection);
            document.getElementById('btnCloseCollection').addEventListener('click', closeCollection);

            function openCollection() {
                const list = document.getElementById('collectionList');
                list.innerHTML = '';

                const sortedAuras = [...AURAS].reverse();

                sortedAuras.forEach(aura => {
                    const count = state.inventory[aura.id] || 0;
                    const isUnlocked = count > 0;

                    const card = document.createElement('div');
                    card.className = `collection-card ${isUnlocked ? 'unlocked' : 'locked'}`;
                    
                    card.innerHTML = `
                        ${isUnlocked ? `<div class="card-count">x${count}</div>` : ''}
                        <div style="width: 30px; height: 30px; border-radius: 50%; background: ${isUnlocked ? aura.color : '#4b5563'}; margin-top: 5px; box-shadow: 0 0 10px ${isUnlocked ? aura.glow : 'transparent'};"></div>
                        <div class="card-name" style="color: ${isUnlocked ? aura.color : '#9ca3af'};">${isUnlocked ? aura.name : '???'}</div>
                        <div class="card-rarity">${formatRarity(aura.chance)}</div>
                    `;
                    list.appendChild(card);
                });

                document.getElementById('collectionModal').classList.add('open');
            }

            function closeCollection() {
                document.getElementById('collectionModal').classList.remove('open');
            }

            // 초기 화면 설정 실행
            updateDisplay();
        });
    </script>
</body>
</html>
